<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR // EMMY AI - LAREDO TX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#00ff88;font-family:monospace;padding:12px;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;border:1px solid #00ff88;padding:10px;border-radius:10px}
.top b{font-size:18px;letter-spacing:2px}.live{color:#00ff00}
.eyes{display:flex;justify-content:center;gap:20px;margin:18px 0}
.eye{width:110px;height:110px;background:#001a0f;border:3px solid #00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 25px #00ff88}
.pupil{width:48px;height:48px;background:#00ff88;border-radius:50%;box-shadow:0 0 20px #00ff88;transition:.1s}
.card{border:1px solid #00ff88;border-radius:12px;padding:12px;margin:12px 0;background:#02120a}
.card h3{margin:0 0 10px;color:#fff;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid #00ff8855;padding:10px;border-radius:8px;text-align:center}
.stat b{font-size:20px;display:block;color:#fff}
button{width:100%;padding:13px;margin:6px 0;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:900;font-size:15px}
button.out{background:transparent;color:#00ff88;border:1px solid #00ff88}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #00ff88;background:#000;color:#fff;font-size:16px}
#chatBox{max-height:220px;overflow-y:auto;margin-bottom:10px}
.msg{padding:8px 10px;border-radius:8px;margin:6px 0;background:#022a18}
.msg.me{background:#0a3a2a;text-align:right}
a{color:#00ff88;text-decoration:none}
.small{font-size:12px;opacity:.8}
</style>
</head>
<body>
<div class="top"><div><b>STAR // SYSTEM ONLINE</b><div class="small">EMMY AI - LAREDO TX</div></div><div class="live">● LIVE</div></div>

<div class="eyes"><div class="eye"><div class="pupil" id="p1"></div></div><div class="eye"><div class="pupil" id="p2"></div></div></div>
<center><button onclick="speakStatus()">🎤 SAY: STAR, STATUS</button></center>

<div class="card"><h3>📊 DASHBOARD</h3><div class="grid">
<div class="stat"><span>CPU CORES</span><b id="cpu">-</b></div>
<div class="stat"><span>RAM</span><b id="ram">-</b></div>
<div class="stat"><span>BATTERY</span><b id="bat">-</b></div>
<div class="stat"><span>SCREEN</span><b id="scr">-</b></div>
</div><div class="small" id="time" style="text-align:center;margin-top:8px"></div></div>

<div class="card"><h3>🌦️ LAREDO, TX WEATHER - LIVE</h3><div id="weather">Loading weather...</div><button class="out" onclick="getWeather()">🔄 Refresh Weather</button></div>

<div class="card"><h3>💬 CHAT WITH STAR</h3><div id="chatBox"><div class="msg">Hello Boss Emmy! I am STAR. Ask me anything. Try: hello, who are you, time, weather, joke</div></div><input id="chatInput" placeholder="Type to STAR... e.g hello" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">SEND TO STAR ➤</button><button class="out" onclick="voiceChat()">🎤 Speak to STAR</button></div>

<div class="card"><h3>🎵 MUSIC & YOUTUBE</h3>
<button onclick="window.open('https://www.youtube.com/results?search_query=afrobeats+2026','_blank')">🔥 Afrobeats Hits</button>
<button onclick="window.open('https://www.youtube.com/results?search_query=amapiano+mix','_blank')">🎹 Amapiano Mix</button>
<button onclick="window.open('https://www.youtube.com/results?search_query=gospel+music+nigeria','_blank')">🙏 Gospel Nigeria</button>
<button onclick="window.open('https://www.youtube.com/results?search_query=chris+brown+2026','_blank')">🎤 Chris Brown</button>
<button class="out" onclick="window.open('https://music.youtube.com','_blank')">▶ Open YouTube Music</button></div>

<div class="card"><h3>🦾 JARVIS CONTROL CENTER</h3>
<button onclick="window.location.href='tel:'">📞 Make a Call</button>
<button onclick="window.open('https://wa.me/','_blank')">💬 Open WhatsApp</button>
<button onclick="window.open('https://maps.google.com/?q=Laredo+TX','_blank')">📍 Open Laredo Maps</button>
<button onclick="if(navigator.vibrate)navigator.vibrate(300);speak('Vibrating Boss')">📳 Vibrate Phone</button>
<button onclick="toggleFlash()">🔦 Flashlight On/Off</button>
<button class="out" onclick="window.open('https://github.com/emmy97193-cyber/Emmy-Ai-','_blank')">⚙️ My GitHub Repo</button></div>

<script>
let pupils=[document.getElementById('p1'),document.getElementById('p2')];
document.addEventListener('mousemove',e=>{moveEyes(e.clientX,e.clientY)});
document.addEventListener('touchmove',e=>{moveEyes(e.touches[0].clientX,e.touches[0].clientY)});
function moveEyes(x,y){let dx=(x/window.innerWidth-0.5)*30, dy=(y/window.innerHeight-0.5)*30; pupils.forEach(p=>p.style.transform=`translate(${dx}px,${dy}px)`)}
function speak(t){let u=new SpeechSynthesisUtterance(t);u.rate=1;speechSynthesis.speak(u)}
function speakStatus(){let b=document.getElementById('bat').innerText; speak(`Star online Boss. Battery is ${b}. System is ready in Laredo Texas. All systems green.`)}
document.getElementById('cpu').innerText=navigator.hardwareConcurrency||8;
document.getElementById('ram').innerText=(navigator.deviceMemory||4)+' GB';
document.getElementById('scr').innerText=screen.width+'x'+screen.height;
setInterval(()=>{document.getElementById('time').innerText=new Date().toLocaleString()},1000);
if(navigator.getBattery)navigator.getBattery().then(b=>{function u(){document.getElementById('bat').innerText=Math.round(b.level*100)+'%'}u();b.onlevelchange=u});
async function getWeather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=27.5306&longitude=-99.4808&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit');let d=await r.json();let c=d.current;document.getElementById('weather').innerHTML=`<b style="font-size:28px;color:#fff">${Math.round(c.temperature_2m)}°F</b> Feels ${Math.round(c.apparent_temperature)}°F<br>💧 Humidity: ${c.relative_humidity_2m}% | 💨 Wind: ${c.wind_speed_10m} mph<br><span class="small">Laredo, TX - Live from Open-Meteo</span>`; }catch(e){document.getElementById('weather').innerText='Weather offline - check internet'}}getWeather();
function sendChat(){let inp=document.getElementById('chatInput');let txt=inp.value.trim();if(!txt)return;let box=document.getElementById('chatBox');box.innerHTML+=`<div class="msg me">${txt}</div>`;let low=txt.toLowerCase();let reply="Got it Boss. I am STAR, your Jarvis. Ask me about weather, time, or tap a music button.";
if(low.includes('hello')||low.includes('hi'))reply="Hello Boss Emmy! Welcome back. STAR is online and ready. What do you want - music, weather, or chat?";
else if(low.includes('who are you'))reply="I am STAR - Smart Tech Assistant Response, built by you, Emmy, in Laredo TX. Your personal Jarvis.";
else if(low.includes('weather')){reply="Checking Laredo weather for you Boss...";getWeather()}
else if(low.includes('time'))reply="Boss, the time is "+new Date().toLocaleTimeString();
else if(low.includes('joke'))reply="Why did STAR go to school? To improve his bytes! 😂";
else if(low.includes('love')||low.includes('miss'))reply="Boss, STAR always got you. You are the creator, I am just your assistant. ❤️";
else if(low.includes('music')||low.includes('song'))reply="Boss, scroll down to MUSIC and tap Afrobeats or Amapiano. Let's vibe!";
else if(low.includes('thank'))reply="Anytime Boss. That's what STAR is for. You built me!";
box.innerHTML+=`<div class="msg">⭐ STAR: ${reply}</div>`;speak(reply);inp.value='';box.scrollTop=box.scrollHeight}
function voiceChat(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice not supported on this browser, type instead');return}let r=new SR();r.onresult=e=>{document.getElementById('chatInput').value=e.results[0][0].transcript;sendChat()};r.start()}
let flashOn=false, stream=null;
async function toggleFlash(){try{if(!flashOn){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let track=stream.getVideoTracks()[0];await track.applyConstraints({advanced:[{torch:true}]});flashOn=true;speak('Flashlight on Boss')}else{stream.getTracks().forEach(t=>t.stop());flashOn=false;speak('Flashlight off')}}catch(e){alert('Flashlight needs camera permission on this phone')}}
</script>
</body>
</html>

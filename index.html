<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR SYSTEM - EMMY AI</title>
<style>
body{background:black;color:#00FF00;font-family:monospace;text-align:center;margin:0;padding:20px}
h1{font-size:22px}
.eyes{display:flex;justify-content:center;gap:20px;margin-top:30px}
.eye{width:90px;height:90px;background:#003300;border-radius:50%;border:3px solid #00FF00;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px #00FF00;animation:blink 3s infinite}
.pupil{width:32px;height:32px;background:black;border-radius:50%;border:5px solid #00FF00;transition:0.1s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
.box{border:1px solid #00FF00;padding:15px;margin-top:25px;text-align:left;color:#FFCC00;font-size:15px;line-height:1.8}
button{background:#00FF00;color:black;border:none;padding:12px 20px;font-weight:bold;font-size:16px;margin-top:20px;border-radius:10px}
</style>
</head>
<body>
<h1>STAR // SYSTEM ONLINE</h1>
<p>EMMY AI - LAREDO TX</p>
<div class="eyes">
<div class="eye"><div class="pupil" id="left"></div></div>
<div class="eye"><div class="pupil" id="right"></div></div>
</div>
<button onclick="speakStatus()">SAY: STAR, STATUS</button>
<div class="box" id="dash">LOADING...</div>
<script>
function moveEyes(x,y){
let dx=(x/window.innerWidth-0.5)*22;
let dy=(y/window.innerHeight-0.5)*22;
document.getElementById('left').style.transform=`translate(${dx}px,${dy}px)`;
document.getElementById('right').style.transform=`translate(${dx}px,${dy}px)`;
}
document.addEventListener('mousemove', e=>moveEyes(e.clientX,e.clientY));
document.addEventListener('touchmove', e=>{let t=e.touches[0]; moveEyes(t.clientX,t.clientY);});
let currentBat='unknown';
async function update(){
let cores=navigator.hardwareConcurrency||'--';
let mem=navigator.deviceMemory||'--';
try{let b=await navigator.getBattery(); currentBat=Math.round(b.level*100)+'%';}catch(e){}
document.getElementById('dash').innerHTML=
`CPU CORES: ${cores}<br>RAM: ${mem} GB<br>BATTERY: ${currentBat}<br>SCREEN: ${screen.width} x ${screen.height}<br>ONLINE: YES - EMMY AI<br>MODE: STAR TREK LCARS`;
}
update(); setInterval(update,2000);
function speakStatus(){
let msg=new SpeechSynthesisUtterance(`Star system online. Battery ${currentBat}. CPU ${navigator.hardwareConcurrency} cores. Emmy AI ready Boss.`);
speechSynthesis.speak(msg);
}
</script>
</body>
</html>
